<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment History</title>

    <link rel="stylesheet" href="payment-history.css">
    <link rel="stylesheet" href="toast.css">

</head>

<body>

    <!-- Header -->

    <div class="history-header">

        <a id="backBtn" class="back-circle">
            ❮
        </a>

        <div class="header-text">
            <h1> Payment History</h1>
            <p>View all customer payment records</p>
        </div>

    </div>

    <!-- Customer Card -->

    <div class="customer-card">

       <div class="customer-avatar" id="customerAvatar">
    A
</div>

        <div class="customer-info">

            <h2 id="customerName">
                Customer Name
            </h2>
            
            <p id="customerMobile">
            📞 Mobile Number
        </p>

            <p>
                Payment Records
            </p>

        </div>

    </div>

    <!-- Summary -->

    <div class="summary-card">

        <p>Total Amount Paid</p>

        <h2 id="totalPaid">
            ₹0
        </h2>

    </div>

    <!-- Payment History -->

    <h2 class="section-title">
        Payment Timeline
    </h2>

    <div id="paymentHistory">

        <div class="history-card">

            <h3>No Payments Yet</h3>

            <p>
                No payment records available.
            </p>

        </div>

    </div>

    <!-- Loader -->

    <div id="loader" class="loader-overlay">

        <div class="loader"></div>

    </div>

    <!-- Scripts -->

    <script src="loader.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>

    <script type="module" src="payment-history.js"></script>

</body>

</html>
