<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receive Payment</title>

<link rel="stylesheet" href="toast.css">
<link rel="stylesheet" href="payments.css">

</head>

<body>

<!-- Loader -->

<div id="loader" class="loader-overlay">
    <div class="loader"></div>
</div>

<!-- Header -->

<div class="page-header payment-page-header">

    <a id="backBtn" class="back-circle">
        ❮
    </a>

    <div class="header-content">

        <h1>Receive Payment</h1>

     <p>Record customer payment quickly</p>

    </div>

</div>

<div class="container">

    <!-- Customer Card -->

    <div class="payment-card">

        <div class="customer-profile">

            <div id="customerAvatar" class="customer-avatar">
                A
            </div>

            <div class="customer-info">

                <h2 id="customerName">
                    Customer Name
                </h2>

                <p id="customerMobile">
                    📞 Mobile Number
                </p>

            </div>

        </div>

        <!-- Summary -->

        <div class="payment-summary">

            <div class="summary-item">

                <span>Total Loan</span>

                <strong id="totalLoan">
                    ₹0
                </strong>

            </div>

            <div class="summary-item">

                <span>Paid</span>

                <strong class="paid-text" id="totalPaid">
                    ₹0
                </strong>

            </div>

            <div class="summary-item">

                <span>Balance</span>

                <strong class="balance-text" id="balanceAmount">
                    ₹0
                </strong>

            </div>

        </div>

    </div>

    <!-- Payment Card -->

    <div class="payment-card">

        <div class="input-group">



            <input
                type="number"
                id="amount"
                placeholder="₹ Enter Payment Amount">

        </div>

        <!-- Quick Amount -->

        <label class="quick-label">

            Quick Amount

        </label>

        <div class="quick-amounts">

            <button
                type="button"
                class="quick-btn"
                onclick="document.getElementById('amount').value=100">

                ₹100

            </button>

            <button
                type="button"
                class="quick-btn"
                onclick="document.getElementById('amount').value=500">

                ₹500

            </button>

            <button
                type="button"
                class="quick-btn"
                onclick="document.getElementById('amount').value=1000">

                ₹1000

            </button>

            <button
                type="button"
                class="quick-btn"
                onclick="document.getElementById('amount').value=2000">

                ₹2000

            </button>

        </div>

        <button
            onclick="receivePayment()"
            class="save-btn">

            ✅ Receive Payment

        </button>

    </div>

</div>

<script src="loader.js"></script>
<script src="toast.js"></script>
<script src="theme.js"></script>

<script type="module" src="payments.js"></script>

</body>
</html>
