<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Payment</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="toast.css">

</head>

<body>

    <!-- Header -->

    <div class="edit-header">

        <a id="backBtn" class="back-circle">
            ❮
        </a>

        <div class="header-text">
            <h1>💰 Edit Payment</h1>
            <p>Update customer payment details</p>
        </div>

    </div>

    <!-- Main Card -->

    <div class="edit-card">

        <h2>Payment Information</h2>



        <div class="input-group">

            <label for="customerName">
                👥 Customer
            </label>

            <div id="customerName" class="customer-display">
                Customer Payment
            </div>

        </div>

        <div class="input-group">

            <label for="amount">
                💵 Payment Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="₹ Enter payment amount"
                min="1">

        </div>

        <div class="input-group">

            <label for="date">
                📅 Payment Date & Time
            </label>

            <input
                type="datetime-local"
                id="date">

        </div>

        <button
            id="updateBtn"
            class="update-btn">

            Update Payment

        </button>

    </div>

    <!-- Loader -->

    <div id="loader" class="loader-overlay">
        <div class="loader"></div>
    </div>

    <!-- Scripts -->

    <script src="loader.js"></script>
    <script src="toast.js"></script>
    <script src="auth.js"></script>
    <script src="theme.js"></script>

    <script type="module" src="edit-payment.js"></script>

</body>

</html>
