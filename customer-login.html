<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Customer Login</title>

<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="toast.css">

<!-- Google Material Symbols -->
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

</head>

<body>

<!-- Background -->

<div class="background"></div>


<!-- Lamp Animation -->

<div class="lamp-area">

    <div class="lamp">

        <div class="lamp-top"></div>

        <div class="lamp-stand"></div>

        <div class="lamp-base"></div>

        <div class="light"></div>

    </div>

</div>


<!-- Login Card -->

<main class="login-card">

    <!-- Welcome -->

    <div class="login-icon">

        <span class="material-symbols-outlined">
            person
        </span>

    </div>

    <h1>
        Welcome Back
    </h1>

    <p class="subtitle">
        Sign in to your Khata account
    </p>


    <!-- Mobile Number -->

    <div class="input-group">

        <label for="mobile">

            <span class="material-symbols-outlined">
                phone
            </span>

            Registered Mobile Number

        </label>

        <div class="input-wrapper">

            <span class="country-code">
                +91
            </span>

            <input
                type="tel"
                id="mobile"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                placeholder="Enter 10-digit mobile number">

        </div>

        <small class="input-hint">

            Use the mobile number registered with your account.

        </small>

    </div>


    <!-- Continue -->

    <button
        type="button"
        id="continueBtn"
        class="login-btn"
        onclick="sendCustomerOTP()">

        <span>
            Continue
        </span>


    </button>


    <!-- Security -->

    <div class="security-note">

        <span class="material-symbols-outlined">
            lock
        </span>

        <span>
            Your account information is secure
        </span>

    </div>


    <!-- Back -->

    <a
        href="index.html"
        class="back-btn">

        <span class="material-symbols-outlined">
            arrow_back
        </span>

        <span>
            Back to Home
        </span>

    </a>

</main>


<!-- Loader -->

<div
    id="loader"
    class="loader-overlay">

    <div class="loader"></div>

</div>


<!-- Scripts -->

<script src="loader.js"></script>

<script src="toast.js"></script>

<script
    type="module"
    src="customer.js">
</script>


<script>

/* ======================================
   MOBILE NUMBER VALIDATION
====================================== */

const mobileInput =
    document.getElementById("mobile");

const continueBtn =
    document.getElementById("continueBtn");


mobileInput?.addEventListener("input", () => {

    mobileInput.value =
        mobileInput.value
        .replace(/\D/g, "")
        .slice(0, 10);

});


/* ======================================
   DEMO OTP FLOW
====================================== */

window.sendCustomerOTP = function () {

    const mobile =
        mobileInput?.value.trim();

    if (!mobile) {

        if (typeof showToast === "function") {

            showToast(
                "Please enter your mobile number.",
                "warning"
            );

        }

        mobileInput?.focus();

        return;

    }


    if (!/^[6-9]\d{9}$/.test(mobile)) {

        if (typeof showToast === "function") {

            showToast(
                "Enter a valid 10-digit mobile number.",
                "warning"
            );

        }

        mobileInput?.focus();

        return;

    }


    /*
       Demo OTP

       In the next step we will create
       the OTP screen and verify this OTP.
    */

    sessionStorage.setItem(
        "customerLoginMobile",
        mobile
    );

    


    if (typeof showLoader === "function") {
        showLoader();
    }


    setTimeout(() => {

        if (typeof hideLoader === "function") {
            hideLoader();
        }

        window.location.href =
            "customer-otp.html";

    }, 500);

};

</script>

</body>

</html>
