<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Reset Admin Password</title>

<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="toast.css">

<!-- Google Material Symbols -->
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

</head>

<body>

<!-- ================================
     BACKGROUND
================================ -->

<div class="background"></div>


<!-- ================================
     LOADER
================================ -->

<div
    id="loader"
    class="loader-overlay">

    <div class="loader"></div>

</div>


<!-- ================================
     RESET CARD
================================ -->

<main class="login-card">


    <!-- Icon -->

    <div class="login-icon">

        <span class="material-symbols-outlined">

            lock_reset

        </span>

    </div>


    <!-- Heading -->

    <h1>

        Reset Password

    </h1>


    <p class="subtitle">

        Verify your Master Password to reset
        your administrator credentials.

    </p>


    <!-- ================================
         MASTER PASSWORD
    ================================= -->

    <div class="input-group">

        <label for="masterPassword">

            <span class="material-symbols-outlined">

                admin_panel_settings

            </span>

            Master Password

        </label>


        <div class="input-wrapper password-wrapper">

            <span class="input-leading-icon material-symbols-outlined">

                key

            </span>


            <input
                type="password"
                id="masterPassword"
                placeholder="Enter Master Password"
                autocomplete="off">


            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(
                    'masterPassword',
                    this
                )"
                aria-label="Show password">

                <span class="material-symbols-outlined">

                    visibility

                </span>

            </button>

        </div>

    </div>


    <!-- ================================
         NEW USERNAME
    ================================= -->

    <div class="input-group">

        <label for="newUsername">

            <span class="material-symbols-outlined">

                person

            </span>

            New Username

        </label>


        <div class="input-wrapper">

            <span class="input-leading-icon material-symbols-outlined">

                person

            </span>


            <input
                type="text"
                id="newUsername"
                placeholder="Enter New Username"
                autocomplete="username">

        </div>

    </div>


    <!-- ================================
         NEW PASSWORD
    ================================= -->

    <div class="input-group">

        <label for="newPassword">

            <span class="material-symbols-outlined">

                lock

            </span>

            New Password

        </label>


        <div class="input-wrapper password-wrapper">

            <span class="input-leading-icon material-symbols-outlined">

                lock

            </span>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter New Password"
                autocomplete="new-password">


            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(
                    'newPassword',
                    this
                )"
                aria-label="Show password">

                <span class="material-symbols-outlined">

                    visibility

                </span>

            </button>

        </div>

    </div>


    <!-- ================================
         CONFIRM PASSWORD
    ================================= -->

    <div class="input-group">

        <label for="confirmPassword">

            <span class="material-symbols-outlined">

                verified_user

            </span>

            Confirm Password

        </label>


        <div class="input-wrapper password-wrapper">

            <span class="input-leading-icon material-symbols-outlined">

                lock

            </span>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                autocomplete="new-password">


            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(
                    'confirmPassword',
                    this
                )"
                aria-label="Show password">

                <span class="material-symbols-outlined">

                    visibility

                </span>

            </button>

        </div>

    </div>


    <!-- ================================
         RESET BUTTON
    ================================= -->

    <button
        type="button"
        class="login-btn"
        onclick="resetAdminPassword()">

        <span>

            Reset Password

        </span>


    </button>


    <!-- ================================
         SECURITY
    ================================= -->

    <div class="security-note">

        <span class="material-symbols-outlined">

            verified_user

        </span>

        <span>

            Your administrator credentials are protected

        </span>

    </div>


    <!-- ================================
         BACK
    ================================= -->

    <a
        href="admin-login.html"
        class="back-btn">

        <span class="material-symbols-outlined">

            arrow_back

        </span>

        <span>

            Back to Admin Login

        </span>

    </a>


</main>


<!-- ================================
     SCRIPTS
================================ -->

<script src="loader.js"></script>

<script src="toast.js"></script>

<script src="theme.js"></script>

<script src="auth.js"></script>


<script>

/* ======================================
   SHOW / HIDE PASSWORD
====================================== */

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    const icon =
        button.querySelector(
            ".material-symbols-outlined"
        );


    if (!input || !icon) {
        return;
    }


    if (input.type === "password") {

        input.type = "text";

        icon.textContent =
            "visibility_off";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }

    else {

        input.type = "password";

        icon.textContent =
            "visibility";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* ======================================
   ENTER KEY SUPPORT
====================================== */

document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            resetAdminPassword();

        }

    }
);

</script>


</body>

</html>
