<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Borrowed Product</title>

<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="toast.css">

</head>

<body>

<!-- Header -->

<div class="edit-header">

    <a id="backBtn" class="back-circle">
        ❮
    </a>

    <div class="header-text">
        <h1>🛒 Edit Product</h1>
        <p>Update borrowed product information</p>
    </div>

</div>

<!-- Card -->

<div class="edit-card">

    <h2>Borrowed Product Details</h2>

    <div class="input-group">

        <label for="product">
            📦 Product Name
        </label>

        <input
            type="text"
            id="product"
            placeholder="Enter product name">

    </div>

    <div class="input-group">

        <label for="qty">
            🔢 Quantity
        </label>

        <input
            type="number"
            id="qty"
            placeholder="Enter quantity">

    </div>

    <div class="input-group">

        <label for="price">
            💰 Price per Unit
        </label>

        <input
            type="number"
            id="price"
            placeholder="Enter price">

    </div>

    <div class="input-group">

        <label for="total">
            💵 Total Amount
        </label>

        <input
            type="number"
            id="total"
            placeholder="Total amount"
            readonly>

    </div>

    <div class="input-group">

        <label for="dateTime">
            📅 Date & Time
        </label>

        <input
            type="datetime-local"
            id="dateTime">

    </div>

    <button
        id="updateBtn"
        class="update-btn">

         Update Product

    </button>

</div>

<!-- Loader -->

<div id="loader" class="loader-overlay">
    <div class="loader"></div>
</div>

<script src="loader.js"></script>
<script src="toast.js"></script>
<script src="theme.js"></script>

<script type="module" src="edit-loan.js"></script>

</body>

</html>
